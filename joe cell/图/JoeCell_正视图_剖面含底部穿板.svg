<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 700" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#141a22">Joe Cell 正视图 · 剖面（含顶部圆锥与底部穿板）</text>
  <text x="310" y="47" text-anchor="middle" font-size="11.5" fill="#7d8798">水面 = 中性管上沿 ｜ 负极管露出水面 1 cm ｜ 各管下沿齐平、距罐底 1&#8243; ｜ 间距均匀 0.5&#8243;</text>

  <!-- 顶部圆锥 -->
  <path d="M 142,190 L 310,110 L 478,190" fill="#fdf5e4" stroke="#0d4f7c" stroke-width="5" stroke-linejoin="round"/>
  <rect x="296" y="72" width="28" height="40" fill="#ffffff" stroke="#0d4f7c" stroke-width="3.5"/>
  <text x="368" y="86" font-size="11.5" fill="#0d4f7c">← 锥顶开口 + 焊接 316L 短管</text>
  <text x="368" y="103" font-size="10.5" fill="#7d8798">（详见下方气路图）</text>
  <text x="152" y="180" font-size="11" fill="#a06a00">坡度角 45°–60°</text>
  <text x="152" y="196" font-size="10" fill="#7d8798">（目标：胡夫 51.85°）</text>

  <!-- 罐体 = 正极管 6" -->
  <rect x="134" y="190" width="352" height="430" rx="3" fill="#ffffff" stroke="#0d4f7c" stroke-width="7"/>
  <!-- 水 -->
  <rect x="141" y="250" width="338" height="370" fill="#eef6fb"/>
  <line x1="141" y1="250" x2="479" y2="250" stroke="#1a7fb5" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="184" y="243" font-size="10.5" fill="#1a7fb5">水面</text>

  <!-- 中性管3 5" -->
  <line x1="170" y1="250" x2="170" y2="565" stroke="#566276" stroke-width="4.5"/>
  <line x1="450" y1="250" x2="450" y2="565" stroke="#566276" stroke-width="4.5"/>
  <!-- 中性管2 4" -->
  <line x1="198" y1="250" x2="198" y2="565" stroke="#566276" stroke-width="4.5"/>
  <line x1="422" y1="250" x2="422" y2="565" stroke="#566276" stroke-width="4.5"/>
  <!-- 中性管1 3" -->
  <line x1="226" y1="250" x2="226" y2="565" stroke="#566276" stroke-width="4.5"/>
  <line x1="394" y1="250" x2="394" y2="565" stroke="#566276" stroke-width="4.5"/>
  <!-- 负极管 2"（露出水面） -->
  <line x1="254" y1="238" x2="254" y2="565" stroke="#b21f2d" stroke-width="5.5"/>
  <line x1="366" y1="238" x2="366" y2="565" stroke="#b21f2d" stroke-width="5.5"/>

  <!-- 底部三爪 + 螺杆 -->
  <path d="M 256,565 L 306,600 M 364,565 L 314,600" stroke="#b21f2d" stroke-width="3"/>
  <line x1="310" y1="565" x2="310" y2="664" stroke="#b21f2d" stroke-width="6"/>
  <!-- 罐底 -->
  <rect x="134" y="612" width="352" height="9" fill="#0d4f7c"/>
  <!-- 内垫片 / 内螺母（罐内） -->
  <rect x="292" y="596" width="36" height="5" rx="1.5" fill="#0e7a4a"/>
  <rect x="296" y="586" width="28" height="10" rx="2" fill="#566276"/>
  <!-- 外垫片 / 外螺母（罐外） -->
  <rect x="292" y="625" width="36" height="5" rx="1.5" fill="#0e7a4a"/>
  <rect x="296" y="634" width="28" height="10" rx="2" fill="#566276"/>

  <!-- 左侧标注 -->
  <line x1="100" y1="244" x2="248" y2="244" stroke="#b21f2d" stroke-width="1"/>
  <text x="96" y="240" text-anchor="end" font-size="10.5" fill="#b21f2d">露出水面 1 cm</text>
  <line x1="96" y1="565" x2="248" y2="565" stroke="#566276" stroke-width="1"/>
  <text x="92" y="561" text-anchor="end" font-size="10.5" fill="#566276">各管下沿齐平</text>
  <text x="92" y="576" text-anchor="end" font-size="10.5" fill="#566276">距罐底 1&#8243;</text>
  <line x1="252" y1="612" x2="252" y2="565" stroke="#7d8798" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 右侧标注 -->
  <text x="492" y="258" font-size="11" fill="#0d4f7c">正极管 6&#8243;（= 外体）</text>
  <text x="492" y="330" font-size="11" fill="#566276">中性管 5&#8243; / 4&#8243; / 3&#8243;</text>
  <text x="492" y="420" font-size="11" fill="#b21f2d">负极管 2&#8243;</text>
  <line x1="486" y1="200" x2="486" y2="196" stroke="none"/>

  <!-- 底部说明 -->
  <text x="310" y="676" text-anchor="middle" font-size="11" fill="#7d8798">底部：负极管三爪 → 螺杆穿罐底 ｜ 内外双层绝缘垫片（绿）+ 内外螺母对压 ⇒ 绝缘 + 密封（穿板接头）</text>
  <text x="310" y="694" text-anchor="middle" font-size="11" fill="#b21f2d">🔴 生死判据：装好后测「螺杆 ↔ 罐壳」应为无穷大（干态 + 灌水后各测一次）</text>
</svg>